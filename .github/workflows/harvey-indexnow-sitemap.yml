name: Harvey - IndexNow semanal para paginas propias actualizadas

# Unico workflow programado en rama DEFAULT main del repo publico de la agencia.
# Solo envia si el sitemap (URL + lastmod) ha cambiado desde el aviso anterior.
# En el push inicial crea el marcador porque el primer envio se verifico
# en el run privado 41338440183 (IndexNow HTTP 202 para las cuatro URL).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harvey-indexnow-sitemap.yml'
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    name: Validar y avisar sin repetir URL sin cambios
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Leer solo codigo de Harvey
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verificar clave publica y sitemap, crear huella estable
        run: python3 scripts/harvey_indexnow_sitemap.py --snapshot
      - name: Restaurar huella de ultimo aviso aceptado
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: .indexnow-sent-marker
          key: harvey-indexnow-v1-${{ hashFiles('.indexnow-snapshot.json') }}
      - name: Omitir duplicado del primer aviso ya aceptado
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        run: echo 'Preparacion inicial sin duplicar el envio HTTP 202 confirmado del 01/11/2026.'
      - name: Notificar a IndexNow si hay cambios reales
        if: github.event_name != 'push' && steps.cache.outputs.cache-hit != 'true'
        run: python3 scripts/harvey_indexnow_sitemap.py --submit
      - name: Registrar huella tras envio correcto
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo 'Aviso aceptado o bootstrap confirmado' > .indexnow-sent-marker
      - name: Recordar huella para evitar nuevos envios redundantes
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .indexnow-sent-marker
          key: harvey-indexnow-v1-${{ hashFiles('.indexnow-snapshot.json') }}
      - name: Resultado
        run: echo 'Verificacion del sitio completada. Repeticion solo si URLs o lastmod cambian.'
