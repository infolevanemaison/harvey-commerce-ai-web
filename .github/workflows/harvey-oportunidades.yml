name: Harvey — detectar oportunidades públicas (sin contactar)
on:
  push:
    paths:
      - ".github/workflows/harvey-oportunidades.yml"
      - "scripts/monitor_oportunidades.py"
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

concurrency:
  group: harvey-oportunidades-unico
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  revisar-anuncios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Detectar ofertas indexadas y guardar hasta 3 borradores para revisión
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/monitor_oportunidades.py
