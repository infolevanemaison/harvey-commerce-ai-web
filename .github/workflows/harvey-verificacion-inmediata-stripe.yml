name: Harvey - Verificacion inmediata de Stripe (solo lectura)
on:
  push:
    paths:
      - '.github/workflows/harvey-verificacion-inmediata-stripe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: harvey-pagos-solo-uno
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer monitor desde main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Consultar Stripe con el monitor real (sin imprimir credenciales)
        env:
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/harvey_verificar_pagos.py
